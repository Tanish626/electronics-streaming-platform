name: electronics-streaming

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      # KRaft: this single node is both broker and controller (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Two listeners so both worlds can connect:
      #   INTERNAL = other containers  -> kafka:9092
      #   EXTERNAL = your laptop       -> localhost:9094
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-broker settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics are created explicitly by kafka-init, never implicitly
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 48
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in orders page_views cart_events price_changes inventory_updates; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        echo "--- topics ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"

  # S3-compatible object store. The image runs `weed mini -dir=/data` by default
  # (master + volume + filer + S3 gateway + admin UI in one process).
  # S3_BUCKET makes it create the bucket on startup.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    container_name: seaweedfs
    ports:
      - "${S3_API_PORT:-8333}:8333"
      - "${S3_ADMIN_UI_PORT:-23646}:23646"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakeadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakesecret123}
      S3_BUCKET: ${LAKE_BUCKET:-lakehouse}
    volumes:
      - seaweedfs_data:/data

  # Spark in local mode. Idle container: jobs are launched with `docker compose exec`
  # (and later as their own streaming service). Job code is mounted from ./spark/jobs.
  spark:
    build: ./spark
    image: electronics-spark:3.5.3
    container_name: spark
    depends_on:
      kafka:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    command: ["sleep", "infinity"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakeadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakesecret123}
      LAKE_BUCKET: ${LAKE_BUCKET:-lakehouse}
    volumes:
      - ./spark/jobs:/opt/app:ro
      - spark_ivy:/opt/ivy

volumes:
  kafka_data:
  seaweedfs_data:
  spark_ivy: